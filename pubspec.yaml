name: carebot
description: "CareBot - Smart Healthcare Management System"

publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  fl_chart: ^0.65.0 
  http: ^1.4.0
  dio: ^5.4.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/screens/
    - assets/images/logo/
    - assets/images/avatars/
    - assets/images/avatars-doctor/
    - assets/images/avatars-patient/
    - assets/images/avatars-staff/
    - assets/images/flags/
    - assets/icons/
